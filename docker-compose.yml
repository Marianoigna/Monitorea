services:

  web:
    build: .
    command: >
      sh -c "export MQTT_AUTOSTART=1 &&
             cd CORE &&
             python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 MONITOREA.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/CORE
    environment:
      - DJANGO_SETTINGS_MODULE=MONITOREA.settings
      - MQTT_AUTOSTART=1

volumes:
  sqlite_data:
