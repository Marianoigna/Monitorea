{% extends 'base.html' %}

{% block title %}Monitorea — Pago recibido{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">

      <div class="mb-4">
        <span class="display-1">&#x2705;</span>
      </div>

      <h1 class="fw-bold mb-2">¡Pago recibido!</h1>
      <p class="text-body-secondary mb-4">
        Tu suscripci&oacute;n est&aacute; siendo procesada.<br>
        En unos instantes ser&aacute;s redirigido al dashboard.
      </p>

      <div class="spinner-border text-primary mb-4" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>

      <p class="text-body-secondary small">
        Si no sos redirigido autom&aacute;ticamente,
        <a href="{% url 'dashboard:dashboard' %}">hacé clic aqu&iacute;</a>.
      </p>

    </div>
  </div>
</div>

<script>
  setTimeout(function () {
    window.location.href = "{% url 'dashboard:dashboard' %}";
  }, 2500);
</script>
{% endblock %}
